<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบระดับอุดมศึกษา: หลักการและเทคโนโลยีการขยายพันธุ์พืช</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b5e20;
            --primary-light: #4c8c4a;
            --secondary: #f1f8e9;
            --accent: #ff8f00;
            --text-dark: #263238;
            --danger: #c62828;
            --success: #2e7d32;
        }
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: var(--text-dark);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 750px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 35px;
            transition: all 0.3s ease;
        }
        h1 { color: var(--primary); margin-top: 0; font-size: 1.8rem; text-align: center; }
        p.subtitle { text-align: center; color: #546e7a; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #cfd8dc;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { outline: none; border-color: var(--primary); }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { background-color: var(--primary-light); }
        .btn:active { transform: scale(0.99); }
        .btn:disabled { background-color: #90a4ae; cursor: not-allowed; }
        
        /* Quiz Area */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 600;
            color: var(--primary);
        }
        .progress-container {
            width: 100%;
            background-color: #eceff1;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #102027;
        }
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background: var(--secondary);
            border: 2px solid #c5e1a5;
            padding: 15px 18px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.5;
        }
        .option-btn:hover:not(:disabled) {
            background: #dcedc8;
            border-color: var(--primary);
        }
        .option-btn.correct {
            background-color: #c8e6c9 !important;
            border-color: var(--success) !important;
            color: #1b5e20;
            font-weight: 600;
        }
        .option-btn.wrong {
            background-color: #ffcdd2 !important;
            border-color: var(--danger) !important;
            color: #b71c1c;
        }
        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #f5f5f5;
            border-left: 5px solid var(--primary);
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .next-btn { margin-top: 20px; display: none; background-color: var(--accent); }
        .next-btn:hover { background-color: #ef6c00; }

        /* Result Screen */
        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--secondary);
            border: 6px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
        }
        .score-number { font-size: 2.5rem; font-weight: 700; color: var(--primary); }
        .status-msg { text-align: center; font-weight: 600; margin-top: 15px; padding: 10px; border-radius: 8px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- หน้าลงทะเบียน -->
    <div id="start-screen">
        <h1>🌱 แบบทดสอบ: การขยายพันธุ์พืช</h1>
        <p class="subtitle">ระดับปริญญาตรี | จำนวน 15 ข้อ (สุ่มข้อสอบและสลับตัวเลือก)</p>
        <div class="form-group">
            <label for="studentId">รหัสนักศึกษา</label>
            <input type="text" id="studentId" placeholder="เช่น 660101234" required>
        </div>
        <div class="form-group">
            <label for="fullName">ชื่อ - นามสกุล</label>
            <input type="text" id="fullName" placeholder="เช่น นายสมชาย ใจดี" required>
        </div>
        <button class="btn" onclick="startQuiz()">เริ่มทำแบบทดสอบ</button>
    </div>

    <!-- หน้าทำข้อสอบ -->
    <div id="quiz-screen" class="hidden">
        <div class="header-bar">
            <span id="question-counter">ข้อที่ 1 / 15</span>
            <span id="score-tracker">คะแนน: 0</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="question-text" id="question-text"></div>
        <div class="options-grid" id="options-container"></div>
        <div class="feedback-box" id="feedback-box"></div>
        <button class="btn next-btn" id="next-btn" onclick="nextQuestion()">ข้อถัดไป ➔</button>
    </div>

    <!-- หน้าสรุปผล -->
    <div id="result-screen" class="hidden">
        <h1>📊 สรุปผลการทดสอบ</h1>
        <p class="subtitle" id="student-info-display"></p>
        <div class="score-circle">
            <span class="score-number" id="final-score">0/15</span>
            <span>คะแนน</span>
        </div>
        <div id="save-status" class="status-msg">กำลังบันทึกคะแนนไปยัง Google Sheet...</div>
        <button class="btn" style="margin-top: 20px;" onclick="location.reload()">ทำแบบทดสอบอีกครั้ง</button>
    </div>
</div>

<script>
    // *** นำ URL ของ Google Apps Script Web App มาวางที่นี่ ***
    const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';

    // คลังข้อสอบระดับ ป.ตรี จำนวน 15 ข้อ อ้างอิงจากบทเรียน
    const rawQuestions = [
        {
            q: "ในกระบวนการสร้างแกมีโทไฟต์เพศผู้ (Male gametophyte) ภายในอับเรณู (Anther) เซลล์กำเนิดไมโครสปอร์ (Microspore mother cell, 2n) จะเกิดการแบ่งเซลล์อย่างไรก่อนจะพัฒนาเป็นละอองเรณูที่สมบูรณ์?",
            options: [

                "แบ่งแบบ Meiosis ได้ 2 Haploid cells และสลายไป 1 เซลล์ เหลือเพียง Sperm cell ที่พร้อมปฏิสนธิ",
                "แบ่งแบบ Mitosis 2 ครั้งติดต่อกันภายในโพรงอับเรณู (Pollen sac) เพื่อสร้างละอองเรณูจำนวนมาก"
            ],
            answer: 0,
            rationale: "Microspore mother cell (2n) จะแบ่งตัวแบบ Meiosis I และ II ได้ 4 haploid microspores (n) จากนั้นแต่ละไมโครสปอร์จะแบ่ง Mitosis 1 ครั้ง ได้ละอองเรณูที่มี 2 นิวเคลียส คือ Tube cell และ Generative cell"
        },
        {
            q: "เหตุใดการขยายพันธุ์พืชแบบอาศัยเพศ (Sexual propagation) จึงไม่เป็นที่นิยมในการผลิตกิ่งพันธุ์ไม้ผลเชิงการค้าที่ต้องการความสม่ำเสมอ แต่กลับมีความสำคัญอย่างยิ่งในงานปรับปรุงพันธุ์พืช?",
            options: [

                "ต้นที่เพาะจากเมล็ดมักมีระบบรากแก้วที่อ่อนแอและให้ผลผลิตเร็วเกินไปจนต้นโทรม",
                "การเพาะเมล็ดทำให้เกิดการกลายพันธุ์ระดับโครโมโซม (Polyploidy) ทุกครั้งที่งอก",
                "เมล็ดพืชไม่สามารถถ่ายทอดลักษณะเด่นทางพันธุกรรมของต้นแม่ไปยังรุ่นลูกได้เลย"

                "ก้านช่อดอก (Base of scape) ที่หดสั้นลงและเปลี่ยนสภาพเป็นเนื้อเยื่อสะสมแป้ง"
            ],
            answer: 0,
            rationale: "Bulb มีลำต้นที่แท้จริงเป็นแผ่นแบนสั้นๆ เรียกว่า Disc หรือ Basal plate ส่วนที่อวบน้ำและกินได้คือ Fleshy scale leaves ที่ดัดแปลงมาจากฐานใบ"
        },
        {
            q: "ข้อใดอธิบายความแตกต่างระหว่าง 'ทิวเบอร์ (Tuber)' ของมันฝรั่ง กับ 'ซูโดบัลบ์ (Pseudobulb)' ของกล้วยไม้ได้อย่างถูกต้องที่สุด?",

                "Tuber เป็นส่วนปลายของลำต้นใต้ดินที่พองออกเพื่อสะสมอาหารและมีตา (Bud/Eye) อยู่รอบหัว ส่วน Pseudobulb เป็นลำต้นเหนือดินที่อวบน้ำ",

            rationale: "Tuber (เช่น มันฝรั่ง) คือปลายลำต้นใต้ดิน (Stolon tip) ที่พองโตสะสมแป้ง มีตา (Axillary buds) กระจายอยู่ ส่วน Pseudobulb (ลำลูกกล้วย) คือลำต้นเหนือดินของกล้วยไม้กลุ่ม Sympodial ที่อวบน้ำเพื่อสะสมน้ำและอาหาร"

    let shuffledQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let studentId = "";
    let fullName = "";

    // ฟังก์ชันสลับลำดับอาร์เรย์ (Fisher-Yates Shuffle)
    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startQuiz() {
        studentId = document.getElementById('studentId').value.trim();
        fullName = document.getElementById('fullName').value.trim();

        if (!studentId || !fullName) {
            alert("กรุณากรอกรหัสนักศึกษา และ ชื่อ-นามสกุล ให้ครบถ้วนก่อนเริ่มทำแบบทดสอบ");
            return;
        }

        // สลับข้อคำถาม และสลับตัวเลือกภายในแต่ละข้อ
        shuffledQuestions = shuffleArray(rawQuestions).map(item => {
            const correctText = item.options[item.answer];
            const shuffledOptions = shuffleArray(item.options);
            const newAnswerIndex = shuffledOptions.indexOf(correctText);
            return {
                q: item.q,
                options: shuffledOptions,
                answer: newAnswerIndex,
                rationale: item.rationale
            };
        });

        currentIndex = 0;
        score = 0;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        const currentQ = shuffledQuestions[currentIndex];
        const total = shuffledQuestions.length;

        document.getElementById('question-counter').innerText = `ข้อที่ ${currentIndex + 1} / ${total}`;
        document.getElementById('score-tracker').innerText = `คะแนน: ${score}`;
        document.getElementById('progress-bar').style.width = `${((currentIndex) / total) * 100}%`;
        document.getElementById('question-text').innerText = `${currentIndex + 1}. ${currentQ.q}`;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        const feedbackBox = document.getElementById('feedback-box');
        feedbackBox.style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        const prefixes = ['ก.', 'ข.', 'ค.', 'ง.'];

        currentQ.options.forEach((optText, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${prefixes[idx]} ${optText}`;
            btn.onclick = () => selectAnswer(idx, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(selectedIndex, selectedBtn) {
        const currentQ = shuffledQuestions[currentIndex];
        const allButtons = document.querySelectorAll('.option-btn');
        
        // ปิดการกดปุ่มซ้ำ
        allButtons.forEach(btn => btn.disabled = true);

        const feedbackBox = document.getElementById('feedback-box');
        
        if (selectedIndex === currentQ.answer) {
            score++;
            selectedBtn.classList.add('correct');
            feedbackBox.innerHTML = `<strong>✅ ถูกต้อง!</strong><br>${currentQ.rationale}`;
            feedbackBox.style.borderLeftColor = 'var(--success)';
        } else {
            selectedBtn.classList.add('wrong');
            allButtons[currentQ.answer].classList.add('correct');
            feedbackBox.innerHTML = `<strong>❌ ไม่ถูกต้อง</strong><br>${currentQ.rationale}`;
            feedbackBox.style.borderLeftColor = 'var(--danger)';
        }

        document.getElementById('score-tracker').innerText = `คะแนน: ${score}`;
        feedbackBox.style.display = 'block';
        
        const nextBtn = document.getElementById('next-btn');
        nextBtn.innerText = (currentIndex === shuffledQuestions.length - 1) ? "ดูผลคะแนนและส่งข้อมูล ➔" : "ข้อถัดไป ➔";
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < shuffledQuestions.length) {
            renderQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        const total = shuffledQuestions.length;
        document.getElementById('student-info-display').innerText = `รหัส: ${studentId} | ชื่อ: ${fullName}`;
        document.getElementById('final-score').innerText = `${score}/${total}`;

        sendScoreToGoogleSheet(studentId, fullName, score, total);
    }

    function sendScoreToGoogleSheet(id, name, userScore, totalQuestions) {
        const statusEl = document.getElementById('save-status');
        
        if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL' || !SCRIPT_URL) {
            statusEl.style.backgroundColor = '#fff3e0';
            statusEl.style.color = '#e65100';
            statusEl.innerText = "⚠️ ยังไม่ได้ตั้งค่า URL ของ Google Apps Script (คะแนนยังไม่ถูกบันทึกลง Sheet)";
            return;
        }

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // สำคัญสำหรับส่งข้อมูลข้ามโดเมนไปยัง Google Apps Script
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                studentId: id,
                fullName: name,
                score: userScore,
                total: totalQuestions
            })
        })
        .then(() => {
            statusEl.style.backgroundColor = '#e8f5e9';
            statusEl.style.color = '#1b5e20';
            statusEl.innerText = "✅ บันทึกคะแนนลงใน Google Sheet เรียบร้อยแล้ว!";
        })
        .catch(error => {
            console.error('Error:', error);
            statusEl.style.backgroundColor = '#ffebee';
            statusEl.style.color = '#c62828';
            statusEl.innerText = "❌ เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาแคปหน้าจอนี้ส่งอาจารย์";
        });
    }
